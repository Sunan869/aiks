name: aiks-team

services:
  aiks-service:
    build:
      context: ../..
      dockerfile: deploy/team/Dockerfile
      args:
        RUST_VERSION: ${AIKS_RUST_VERSION:-1.98.1}
    image: ${AIKS_IMAGE_NAME:-aiks-service}:${AIKS_IMAGE_TAG:-s2-dev}
    container_name: ${AIKS_CONTAINER_NAME:-aiks-service-team}
    network_mode: host
    env_file:
      - .env
    environment:
      AIKS_CONFIG_PATH: /run/aiks/service.toml
    volumes:
      - ${AIKS_DATA_DIR:-./data}:/var/lib/aiks-team
    read_only: true
    tmpfs:
      - /run/aiks:rw,noexec,nosuid,size=1m,mode=0700
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H "Host: $${AIKS_PUBLIC_HOST}"
          "http://127.0.0.1:$${AIKS_SERVICE_PORT:-28081}/healthz" >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
