name: aiks-team

services:
  siyuan:
    image: ${SIYUAN_IMAGE:-b3log/siyuan:latest}
    container_name: ${SIYUAN_CONTAINER_NAME:-aiks-siyuan}
    network_mode: host
    volumes:
      - ${AIKS_SIYUAN_DATA_DIR:-./siyuan-data}:/siyuan/workspace
    command:
      - --workspace=/siyuan/workspace
      - --accessAuthCode=${AIKS_SIYUAN_TOKEN}
    restart: unless-stopped

  aiks-service:
    image: ${AIKS_IMAGE:-aiks-service:s2-dev}
    container_name: ${AIKS_CONTAINER_NAME:-aiks-service-team}
    network_mode: host
    env_file:
      - .env
    environment:
      AIKS_CONFIG_PATH: /run/aiks/service.toml
    volumes:
      - ${AIKS_DATA_DIR:-./data}:/var/lib/aiks-team
    depends_on:
      - siyuan
    read_only: true
    tmpfs:
      - /run/aiks:rw,noexec,nosuid,size=1m,mode=0700
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H "Host: $${AIKS_PUBLIC_HOST}"
          "http://127.0.0.1:$${AIKS_SERVICE_PORT:-28081}/healthz" >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
