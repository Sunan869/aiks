name: Provider development checks
on:
  push:
    branches: [feature/multi-provider-integration]
    paths:
      - scripts/provider-dev-patch.py
      - .github/workflows/provider-dev.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: provider-development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    if: github.repository == 'Sunan869/aiks' && github.ref == 'refs/heads/feature/multi-provider-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: provider-development
          cache-on-failure: true
      - name: Apply reviewed branch-only integration edits
        run: |
          if test -f scripts/provider-dev-patch.py; then python3 scripts/provider-dev-patch.py; fi
          cargo fmt --all
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Persist mechanical integration edits on this feature branch only
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet || test -f .git/MERGE_HEAD; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates/aiks-core/src crates/aiks-core/tests apps/aiks-cli/src apps/aiks-desktop/src apps/aiks-desktop/src-tauri/src config.example.toml
            git commit -m 'build: reconcile and format multi-provider integration'
            git push origin HEAD:refs/heads/feature/multi-provider-integration
          fi
      - name: Core provider regression and existing regression suites
        run: |
          cargo test -p aiks-core -- --test-threads=1 > /tmp/provider-tests.log 2>&1 || { tail -180 /tmp/provider-tests.log; exit 1; }
          grep -E 'Running |test result:' /tmp/provider-tests.log
      - name: CLI compatibility and core lint
        run: |
          cargo check -p aiks-cli > /tmp/provider-check.log 2>&1 || { tail -120 /tmp/provider-check.log; exit 1; }
          cargo clippy -p aiks-core --all-targets -- -D warnings > /tmp/provider-lint.log 2>&1 || { tail -160 /tmp/provider-lint.log; exit 1; }
          tail -3 /tmp/provider-check.log
          tail -3 /tmp/provider-lint.log
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/aiks-desktop/package-lock.json
      - name: Frontend regression and production build
        working-directory: apps/aiks-desktop
        run: |
          npm ci > /tmp/provider-npm.log 2>&1 || { tail -50 /tmp/provider-npm.log; exit 1; }
          npm test > /tmp/provider-ui-tests.log 2>&1 || { tail -160 /tmp/provider-ui-tests.log; exit 1; }
          tail -8 /tmp/provider-ui-tests.log
          npm run build
