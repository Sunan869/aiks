name: Apply V4.2 sync context refactor

on:
  push:
    branches:
      - fix/v4.2-runtime-resilience
    paths:
      - ".github/workflows/apply-v42-sync-context-refactor.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4.2-runtime-resilience
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Refactor sync run context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/aiks-core/src/sync/engine.rs")
          text = path.read_text(encoding="utf-8")

          if "struct SyncRunContext<'a>" not in text:
              anchor = "pub struct SyncEngine {"
              pos = text.index(anchor)
              context_struct = """struct SyncRunContext<'a> {
              renderer: &'a MarkdownRenderer,
              notebook_id: Option<&'a str>,
          }

          """
              text = text[:pos] + context_struct + text[pos:]

          if "let sync_context = SyncRunContext" not in text:
              notebook_pos = text.index("        let session_notebook_id = if opts.dry_run {")
              loop_pos = text.index("        for summary in &summaries {", notebook_pos)
              context_init = """        let sync_context = SyncRunContext {
              renderer: &renderer,
              notebook_id: session_notebook_id.as_deref(),
          };

          """
              text = text[:loop_pos] + context_init + text[loop_pos:]

          if ".sync_session(db, registry, sink, &sync_context, summary, opts)" not in text:
              call_pattern = re.compile(
                  r"\.sync_session\(\s*db,\s*registry,\s*sink,\s*&renderer,\s*summary,\s*session_notebook_id\.as_deref\(\),\s*opts,\s*\)",
                  re.S,
              )
              text, count = call_pattern.subn(
                  ".sync_session(db, registry, sink, &sync_context, summary, opts)",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("sync_session call pattern not found")

          if "context: &SyncRunContext<'_>" not in text:
              signature_pattern = re.compile(
                  r"(async fn sync_session\(\s*&self,\s*db: &StateDb,\s*registry: &ProviderRegistry,\s*sink: &SiYuanSink,\s*)renderer: &MarkdownRenderer,\s*summary: &SessionSummary,\s*notebook_id: Option<&str>,\s*(opts: &SyncOptions,\s*\) -> SyncOutcome \{)",
                  re.S,
              )
              text, count = signature_pattern.subn(
                  r"\1context: &SyncRunContext<'_>,\n        summary: &SessionSummary,\n        \2",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("sync_session signature pattern not found")

          if "let markdown = context.renderer.render(&session);" not in text:
              text = text.replace(
                  "let markdown = renderer.render(&session);",
                  "let markdown = context.renderer.render(&session);",
                  1,
              )
          if "let notebook_id = match context.notebook_id {" not in text:
              text = text.replace(
                  "let notebook_id = match notebook_id {",
                  "let notebook_id = match context.notebook_id {",
                  1,
              )

          path.write_text(text, encoding="utf-8")
          PY

          cargo fmt --all

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "AIKS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add crates/aiks-core/src/sync/engine.rs
          git diff --cached --quiet && exit 0
          git commit -m "refactor(v4.2): group sync run context"
          git push origin HEAD:fix/v4.2-runtime-resilience
