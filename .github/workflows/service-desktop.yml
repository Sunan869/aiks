name: Service native desktop verification
on:
  push:
    branches: [feature/aiks-service-extraction]
permissions:
  contents: read
concurrency:
  group: service-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-desktop:
    name: native-desktop-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: service-native-desktop
          cache-on-failure: true
      - name: Windows PowerShell 5.1 development entrypoint contract
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\tests\dev-script-contract.ps1
          if (-not $?) { exit 1 }
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Prepare CI-only resource directory
        shell: bash
        run: |
          mkdir -p apps/aiks-desktop/src-tauri/resources/siyuan
          printf 'CI-only Tauri resource placeholder, not an installer\n' > apps/aiks-desktop/src-tauri/resources/siyuan/placeholder.txt
      - name: Native Desktop client contracts
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p aiks-desktop --test service_client -- --test-threads=1 2>&1 | tee native-desktop-tests.log
      - name: Native Service lifecycle and configuration
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p aiks-desktop --lib service_desktop_tests -- --test-threads=1 2>&1 | tee native-service-lifecycle.log
      - name: Team Client contracts
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p aiks-desktop --test team_client -- --test-threads=1 2>&1 | tee team-client-tests.log
      - name: Full workspace Clippy
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee workspace-clippy.log
      - name: Full workspace tests
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast --workspace -- --test-threads=1 2>&1 | tee workspace-tests.log
      - name: Lockfile and source must remain unchanged
        if: always()
        shell: bash
        run: git diff --exit-code
      - name: Native verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-native-${{ matrix.os }}-${{ github.sha }}
          path: |
            native-desktop-tests.log
            native-service-lifecycle.log
            team-client-tests.log
            workspace-clippy.log
            workspace-tests.log
          retention-days: 3
