name: Temporary V4.2 Session Index Green

on:
  push:
    branches: [feature/v4.2-unified-knowledge-backend]
    paths: [.github/workflows/tmp-v42-session-index-green.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.2-unified-knowledge-backend
          fetch-depth: 0
      - name: Apply focused GREEN patch
        run: python3 scripts/tmp_v42_session_index_patch.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit focused patch
        run: |
          rm .github/workflows/tmp-v42-session-index-green.yml
          rm scripts/tmp_v42_session_index_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v4.2): index sessions independently of AI extraction"
          git push origin HEAD:feature/v4.2-unified-knowledge-backend
