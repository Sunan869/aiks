name: TEMP V42 Clippy Fix

on:
  push:
    branches:
      - feature/v4.2-unified-knowledge-backend

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.2-unified-knowledge-backend
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Clippy fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/aiks-core/src/indexing/service.rs')
          s = p.read_text(encoding='utf-8')
          old = 'let mut bytes = Vec::with_capacity(vector.len() * std::mem::size_of::<f32>());'
          new = 'let mut bytes = Vec::with_capacity(std::mem::size_of_val(vector));'
          if old not in s:
              raise SystemExit('expected Clippy target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Format
        run: cargo fmt --all
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aiks-core/src/indexing/service.rs
          git commit -m "fix(v4.2): satisfy index vector clippy check"
          git push origin HEAD:feature/v4.2-unified-knowledge-backend
