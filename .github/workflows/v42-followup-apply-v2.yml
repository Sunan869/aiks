name: V4.2 Follow-up Apply V2

on:
  push:
    branches:
      - fix/v4.2-live-pipeline-settings-diagnostics

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply approved V4.2 follow-up
        run: |
          set -euo pipefail
          python3 scripts/v42_followup_patch_wrapper.py
          cargo fmt --all
          git diff --check

      - name: Commit implementation and remove one-shot tooling
        run: |
          set -euo pipefail
          rm -f \
            scripts/v42_followup_patch.py \
            scripts/v42_followup_patch_wrapper.py \
            .github/workflows/v42-followup-apply.yml \
            .github/workflows/v42-followup-apply-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix(v4.2): stream pipeline and repair settings diagnostics'
          git push origin HEAD:${GITHUB_REF_NAME}
