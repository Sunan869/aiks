name: Temporary V4.2 Session Finish Context

on:
  push:
    branches: [feature/v4.2-unified-knowledge-backend]
    paths:
      - .github/workflows/tmp-v42-session-finish-context.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.2-unified-knowledge-backend
          fetch-depth: 0
      - name: Apply focused refactor
        run: python3 scripts/tmp_v42_session_finish_context.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit focused refactor
        run: |
          rm .github/workflows/tmp-v42-session-finish-context.yml
          rm scripts/tmp_v42_session_finish_context.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v4.2): group session rebuild finish state"
          git push origin HEAD:feature/v4.2-unified-knowledge-backend
