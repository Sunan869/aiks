name: Prepare service generated files
on:
  push:
    branches: [feature/aiks-service-extraction]
    paths: ['**/Cargo.toml', '**/*.rs', 'scripts/service-s1-transform.py', '.github/workflows/service-generated-files.yml']
permissions:
  contents: read
concurrency:
  group: service-generated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'Sunan869/aiks' && github.ref == 'refs/heads/feature/aiks-service-extraction'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply exact reviewed candidate
        if: hashFiles('scripts/service-s1-transform.py') != ''
        run: python3 scripts/service-s1-transform.py
      - name: Resolve and format candidate (not an acceptance gate)
        run: |
          cargo check -p aiks-core -p aiks-service --all-targets > /tmp/service-check.log 2>&1 && echo 0 > /tmp/check-exit.txt || echo $? > /tmp/check-exit.txt
          cargo fmt --all
          git diff --check
      - name: Publish reviewable blobs without updating any ref
        env:
          GH_BLOB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request,zipfile
          assert os.environ['GITHUB_REPOSITORY']=='Sunan869/aiks'
          assert os.environ['GITHUB_REF']=='refs/heads/feature/aiks-service-extraction'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['GITHUB_SHA']
          paths=subprocess.check_output(['git','diff','--name-only','-z']).split(b'\0')
          result={'source_head':head,'check_exit':int(pathlib.Path('/tmp/check-exit.txt').read_text()),'files':[]}
          with zipfile.ZipFile('/tmp/service-review.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for value in paths:
                  if not value: continue
                  path=value.decode()
                  assert path=='Cargo.lock' or path.endswith('.rs'),path
                  old=subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()
                  content=pathlib.Path(path).read_bytes()
                  assert len(content)<=512*1024,path
                  request=urllib.request.Request('https://api.github.com/repos/Sunan869/aiks/git/blobs',method='POST',data=json.dumps({'encoding':'base64','content':base64.b64encode(content).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_BLOB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
                  with urllib.request.urlopen(request,timeout=30) as response: created=json.load(response)
                  result['files'].append({'path':path,'old_sha':old,'sha':created['sha'],'bytes':len(content)})
                  archive.writestr('files/'+path,content)
              archive.writestr('manifest.json',json.dumps(result,indent=2))
              archive.write('/tmp/service-check.log','service-check.log')
              archive.writestr('candidate.patch',subprocess.check_output(['git','diff','--binary']))
          print('GENERATED_BLOBS='+json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: service-generated-review-${{ github.sha }}
          path: /tmp/service-review.zip
          retention-days: 1
