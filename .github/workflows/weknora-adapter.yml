name: WeKnora adapter contracts
on:
  push:
    branches: [feature/aiks-weknora-adapter]
permissions:
  contents: read
concurrency:
  group: weknora-adapter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Lockfile diagnostic
        run: |
          cargo generate-lockfile
          git diff -- Cargo.lock
          exit 1
      - name: Service tests
        run: |
          cargo test --locked --no-fail-fast -p aiks-service -- --test-threads=1
      - name: Service clippy
        run: |
          cargo clippy --locked -p aiks-service --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lockfile unchanged
        run: git diff --exit-code -- Cargo.lock
