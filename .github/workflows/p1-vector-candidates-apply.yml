name: P1 Vector Candidate Apply

on:
  push:
    branches:
      - fix/p1-search-semantics-vector-scaling
    paths:
      - .github/scripts/apply_p1_vector_candidates.py
      - .github/workflows/p1-vector-candidates-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded candidate repository patch
        run: python .github/scripts/apply_p1_vector_candidates.py
      - name: Commit product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aiks-core/src/pipeline/knowledge_repo.rs
          git diff --cached --quiet || git commit -m "fix(p1): bound vector candidate loading"
          git push
