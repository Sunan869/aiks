name: Temporary V4.2 Unified Search Wrapper

on:
  push:
    branches: [feature/v4.2-unified-knowledge-backend]
    paths:
      - .github/workflows/tmp-v42-unified-search-wrapper.yml
      - scripts/tmp_v42_unified_search_wrapper.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.2-unified-knowledge-backend
          fetch-depth: 0
      - name: Apply borrowed DB unified search compatibility patch
        run: python3 scripts/tmp_v42_unified_search_wrapper.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify focused search tests
        run: cargo test -p aiks-core --test v42_unified_search_wiring --test p1_search_semantics
      - name: Verify core compile
        run: cargo check -p aiks-core
      - name: Commit compatibility wrapper
        run: |
          rm .github/workflows/tmp-v42-unified-search-wrapper.yml
          rm scripts/tmp_v42_unified_search_wrapper.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v4.2): preserve legacy search API over unified service"
          git push origin HEAD:feature/v4.2-unified-knowledge-backend
