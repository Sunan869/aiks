name: P1 Search Validation

on:
  push:
    branches:
      - fix/p1-search-semantics-vector-scaling

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/aiks-desktop/package-lock.json

      - name: Search semantics regression
        run: cargo test -p aiks-core --test p1_search_semantics -- --test-threads=1

      - name: Full aiks-core tests
        run: cargo test -p aiks-core

      - name: CLI check
        run: cargo check -p aiks-cli

      - name: Frontend build
        working-directory: apps/aiks-desktop
        run: |
          npm ci
          npm run build

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Desktop Rust check
        run: cargo check -p aiks-desktop
