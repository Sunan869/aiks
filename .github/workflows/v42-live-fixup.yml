name: V4.2 Live Follow-up Fixup

on:
  push:
    branches:
      - fix/v4.2-live-pipeline-settings-diagnostics

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply reviewed fixups
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: anchor count={count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'apps/aiks-desktop/src-tauri/src/lifecycle.rs',
              '                siyuan_url: Arc::new(Mutex::new(None)),\n                data_dir,\n                _watcher_handle: Mutex::new(watcher_handle),',
              '                siyuan_url: Arc::new(Mutex::new(None)),\n                data_dir,\n                close_to_tray: std::sync::atomic::AtomicBool::new(close_to_tray_setting()),\n                _watcher_handle: Mutex::new(watcher_handle),',
          )

          replace_once(
              'apps/aiks-desktop/src/pages/ProcessingPage.tsx',
              'import { useState, useEffect, useCallback } from "react";',
              'import { useState, useEffect, useCallback, useRef } from "react";',
          )
          replace_once(
              'apps/aiks-desktop/src/pages/ProcessingPage.tsx',
              '  const [backfillMsg, setBackfillMsg] = useState("");\n',
              '  const [backfillMsg, setBackfillMsg] = useState("");\n  const inFlightRef = useRef(false);\n',
          )
          replace_once(
              'apps/aiks-desktop/src/pages/ProcessingPage.tsx',
              '  const load = useCallback(async (showLoading = false) => {\n    if (showLoading) setLoading(true);',
              '  const load = useCallback(async (showLoading = false) => {\n    if (inFlightRef.current) return;\n    inFlightRef.current = true;\n    if (showLoading) setLoading(true);',
          )
          replace_once(
              'apps/aiks-desktop/src/pages/ProcessingPage.tsx',
              '    } finally {\n      if (showLoading) setLoading(false);\n    }\n  }, []);',
              '    } finally {\n      inFlightRef.current = false;\n      if (showLoading) setLoading(false);\n    }\n  }, []);',
          )
          replace_once(
              'apps/aiks-desktop/src/api/v42_live_pipeline_settings_diagnostics.test.ts',
              '    expect(processingSource).toContain("clearInterval");\n',
              '    expect(processingSource).toContain("clearInterval");\n    expect(processingSource).toContain("inFlightRef.current");\n',
          )
          PY

          rm -f .github/workflows/v42-live-fixup.yml
          git diff --check

      - name: Commit fixups
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(v4.2): harden live polling and fallback state'
          git push origin HEAD:${GITHUB_REF_NAME}
