name: Apply V4.2 sync formatting

on:
  push:
    branches:
      - fix/v4.2-runtime-resilience
    paths:
      - ".github/workflows/apply-v42-sync-format.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4.2-runtime-resilience
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format sync engine
        shell: bash
        run: |
          cargo fmt --all

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "AIKS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add crates/aiks-core/src/sync/engine.rs
          git diff --cached --quiet && exit 0
          git commit -m "style: format V4.2 sync retry fix"
          git push origin HEAD:fix/v4.2-runtime-resilience
