name: Temporary V4.2 AI Assist Event

on:
  push:
    branches: [feature/v4.2-unified-knowledge-backend]
    paths:
      - .github/workflows/tmp-v42-ai-assist-event.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.2-unified-knowledge-backend
          fetch-depth: 0
      - name: Apply AI Assist event handler
        run: python3 scripts/tmp_v42_ai_assist_event.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit AI Assist event handler
        run: |
          rm .github/workflows/tmp-v42-ai-assist-event.yml
          rm scripts/tmp_v42_ai_assist_event.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v4.2): handle AI assist through canonical SiYuan content"
          git push origin HEAD:feature/v4.2-unified-knowledge-backend
