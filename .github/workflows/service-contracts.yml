name: Service S1 contracts

on:
  push:
    branches: [feature/aiks-service-extraction]

permissions:
  contents: read

concurrency:
  group: service-s1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Core tests
        run: |
          cargo test -p aiks-core -- --test-threads=1 > /tmp/aiks-core-tests.log 2>&1 || { tail -n 120 /tmp/aiks-core-tests.log; exit 1; }
          tail -n 60 /tmp/aiks-core-tests.log
      - name: Service tests
        if: hashFiles('apps/aiks-service/Cargo.toml') != ''
        run: cargo test -p aiks-service -- --test-threads=1
      - name: Core and CLI Clippy
        run: cargo clippy -p aiks-core -p aiks-cli --all-targets -- -D warnings
      - name: Service Clippy
        if: hashFiles('apps/aiks-service/Cargo.toml') != ''
        run: cargo clippy -p aiks-service --all-targets -- -D warnings
      - name: Formatting
        if: always()
        run: cargo fmt --all --check
      - name: Dependency lock delta
        if: always()
        run: git diff -- Cargo.lock
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-s1-test-reports-${{ github.sha }}
          path: /tmp/aiks-core-tests.log
          retention-days: 7
