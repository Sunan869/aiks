name: S2 formatting review candidate
on:
  push:
    branches: [feature/aiks-service-extraction]
    paths: ['**/*.rs', 'scripts/s2-wire-candidate.py', '.github/workflows/s2-format-review.yml']
permissions:
  contents: read
concurrency:
  group: s2-format-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format-review:
    if: github.repository == 'Sunan869/aiks' && github.ref == 'refs/heads/feature/aiks-service-extraction'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact reviewed wiring when present
        if: hashFiles('scripts/s2-wire-candidate.py') != ''
        run: python3 scripts/s2-wire-candidate.py
      - name: Prepare rustfmt-only candidate
        run: |
          cargo fmt --all
          git diff --check
      - name: Publish blobs for explicit review, never move a branch
        env:
          GH_BLOB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request,zipfile
          assert os.environ['GITHUB_REPOSITORY']=='Sunan869/aiks'
          assert os.environ['GITHUB_REF']=='refs/heads/feature/aiks-service-extraction'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['GITHUB_SHA']
          result={'source_head':head,'files':[]}
          with zipfile.ZipFile('/tmp/s2-format-review.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for raw in subprocess.check_output(['git','diff','--name-only','-z']).split(b'\0'):
                  if not raw: continue
                  path=raw.decode()
                  assert path.endswith('.rs') and not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts
                  content=pathlib.Path(path).read_bytes()
                  assert len(content)<=512*1024
                  old_result=subprocess.run(['git','rev-parse',f'HEAD:{path}'],text=True,capture_output=True)
                  old=old_result.stdout.strip() if old_result.returncode==0 else None
                  request=urllib.request.Request('https://api.github.com/repos/Sunan869/aiks/git/blobs',method='POST',data=json.dumps({'encoding':'base64','content':base64.b64encode(content).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_BLOB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
                  with urllib.request.urlopen(request,timeout=30) as response: blob=json.load(response)
                  result['files'].append({'path':path,'old_sha':old,'sha':blob['sha']})
                  archive.writestr('files/'+path,content)
              archive.writestr('manifest.json',json.dumps(result,indent=2))
              archive.writestr('format.patch',subprocess.check_output(['git','diff']))
          print('FORMAT_REVIEW='+json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s2-format-${{ github.sha }}
          path: /tmp/s2-format-review.zip
          retention-days: 2
