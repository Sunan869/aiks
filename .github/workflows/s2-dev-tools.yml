name: S2 isolated development toolchain
on:
  push:
    branches: [feature/aiks-service-extraction]
    paths: ['.github/workflows/s2-dev-tools.yml']
permissions:
  contents: read
jobs:
  public-build-tools:
    if: github.repository == 'Sunan869/aiks' && github.ref == 'refs/heads/feature/aiks-service-extraction'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fetch locked public crates for offline compilation
        run: cargo fetch --locked
      - name: Package compiler and public registry only
        run: |
          set -euo pipefail
          sysroot="$(rustc --print sysroot)"
          tar -C "$sysroot" -czf /tmp/aiks-rust-toolchain.tar.gz bin lib
          tar -C "$HOME/.cargo/registry" -czf /tmp/aiks-cargo-registry.tar.gz cache src index
          rustc --version --verbose > /tmp/aiks-rust-version.txt
          sha256sum /tmp/aiks-rust-toolchain.tar.gz /tmp/aiks-cargo-registry.tar.gz > /tmp/aiks-dev-tools.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: s2-public-build-tools-${{ github.sha }}
          path: |
            /tmp/aiks-rust-toolchain.tar.gz
            /tmp/aiks-cargo-registry.tar.gz
            /tmp/aiks-rust-version.txt
            /tmp/aiks-dev-tools.sha256
          compression-level: 0
          retention-days: 1
