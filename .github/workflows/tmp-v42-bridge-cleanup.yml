name: Temporary V4.2 Bridge Cleanup

on:
  push:
    branches: [feature/v4.2-unified-knowledge-backend]
    paths:
      - .github/workflows/tmp-v42-bridge-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.2-unified-knowledge-backend
          fetch-depth: 0
      - name: Apply bridge cleanup
        run: python3 scripts/tmp_v42_bridge_cleanup.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit focused cleanup
        run: |
          rm .github/workflows/tmp-v42-bridge-cleanup.yml
          rm scripts/tmp_v42_bridge_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v4.2): narrow workbench bridge responsibilities"
          git push origin HEAD:feature/v4.2-unified-knowledge-backend
