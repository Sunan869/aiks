name: Temporary V4.2 sync notebook fix

on:
  push:
    branches:
      - fix/v4.2-runtime-resilience
    paths:
      - .github/workflows/tmp-fix-v42-sync-notebook.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4.2-runtime-resilience
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Patch sync notebook resolution semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/aiks-core/src/sync/engine.rs')
          text = path.read_text()
          old = '''        let session_notebook_id = if opts.dry_run {
              None
          } else {
              Some(sink.ensure_session_notebook().await?)
          };

          let sync_context = SyncRunContext {
              renderer: &renderer,
              notebook_id: session_notebook_id.as_deref(),
          };
'''
          new = '''        let session_notebook_id = if opts.dry_run {
              None
          } else {
              match sink.ensure_session_notebook().await {
                  Ok(id) => Some(id),
                  Err(e) => {
                      error!(error = %e, "[SYNC] Failed to resolve session notebook");
                      None
                  }
              }
          };

          let sync_context = SyncRunContext {
              renderer: &renderer,
              notebook_id: session_notebook_id.as_deref(),
          };
'''
          if old not in text:
              raise SystemExit('expected notebook resolution block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all --check
      - name: Verify B03 regressions
        run: cargo test -p aiks-core --test review_repro b03_ -- --test-threads=1
      - name: Remove temporary workflow and commit fix
        shell: bash
        run: |
          git rm .github/workflows/tmp-fix-v42-sync-notebook.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aiks-core/src/sync/engine.rs
          git commit -m "fix(v4.2): preserve sync retry semantics when notebook lookup fails"
          git push origin HEAD:fix/v4.2-runtime-resilience
