name: P1 Clean Build

on:
  push:
    branches:
      - fix/p1-search-clean-build

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-search-clean-build
          fetch-depth: 1
      - name: Fetch validated implementation
        run: git fetch origin fix/p1-search-semantics-vector-scaling --depth=1
      - name: Apply product changes without formatting noise
        run: |
          git show FETCH_HEAD:crates/aiks-core/src/pipeline/search.rs > crates/aiks-core/src/pipeline/search.rs
          git show FETCH_HEAD:crates/aiks-core/src/pipeline/knowledge_repo.rs > crates/aiks-core/src/pipeline/knowledge_repo.rs
          git show FETCH_HEAD:crates/aiks-core/tests/p1_search_semantics.rs > crates/aiks-core/tests/p1_search_semantics.rs
          git show FETCH_HEAD:apps/aiks-desktop/src/api/types.ts > apps/aiks-desktop/src/api/types.ts
          python - <<'PY'
          from pathlib import Path

          engine_path = Path('crates/aiks-core/src/engine/mod.rs')
          engine = engine_path.read_text()
          engine_start = engine.index('    /// Get hybrid search results')
          engine_end = engine.index('    /// Check AI model health', engine_start)
          new_engine = (
              '    /// Search distilled knowledge while preserving degraded-state/error semantics.\n'
              '    pub async fn search_knowledge(\n'
              '        &self,\n'
              '        query: &str,\n'
              '        limit: usize,\n'
              '    ) -> anyhow::Result<crate::pipeline::search::SearchOutcome> {\n'
              '        let embedding_config = if self.config.embedding.enabled {\n'
              '            Some(&self.config.embedding)\n'
              '        } else {\n'
              '            None\n'
              '        };\n'
              '        crate::pipeline::search::search_with_status(&self.db, query, limit, embedding_config).await\n'
              '    }\n\n'
          )
          engine_path.write_text(engine[:engine_start] + new_engine + engine[engine_end:])

          commands_path = Path('apps/aiks-desktop/src-tauri/src/commands.rs')
          commands = commands_path.read_text()
          search_start = commands.index('/// Search knowledge (FTS5 + fallback to LIKE)')
          search_end = commands.index('// ===== V3 Detail Commands =====', search_start)
          new_search = (
              '/// Search knowledge through the Core search pipeline.\n'
              '///\n'
              '/// The response keeps the existing desktop result shape while also surfacing\n'
              '/// degraded search state (for example, vector backend unavailable).\n'
              '#[tauri::command]\n'
              'pub async fn search_knowledge(\n'
              '    query: String,\n'
              '    limit: Option<usize>,\n'
              "    state: State<'_, AppState>,\n"
              ') -> Result<serde_json::Value, String> {\n'
              '    let engine = state.engine().ok_or("Engine not initialized")?;\n'
              '    let outcome = engine\n'
              '        .search_knowledge(&query, limit.unwrap_or(20))\n'
              '        .await\n'
              '        .map_err(|e| e.to_string())?;\n\n'
              '    let degraded = outcome.degraded();\n'
              '    let warnings: Vec<String> = outcome\n'
              '        .degradations\n'
              '        .iter()\n'
              '        .map(|d| d.message.clone())\n'
              '        .collect();\n\n'
              '    let db = engine.db();\n'
              '    let repo = aiks_core::KnowledgeRepo::new(&db);\n'
              '    let mut results = Vec::new();\n'
              '    for hit in outcome.hits {\n'
              '        if let Some(detail) = repo\n'
              '            .get_by_id(&hit.knowledge_id)\n'
              '            .map_err(|e| e.to_string())?\n'
              '        {\n'
              '            results.push(serde_json::json!({\n'
              '                "id": detail.id,\n'
              '                "title": detail.title,\n'
              '                "category": detail.category,\n'
              '                "summary": detail.summary,\n'
              '                "project_name": detail.project_name,\n'
              '                "tags": detail.tags,\n'
              '                "confidence": detail.confidence,\n'
              '                "match_type": hit.match_type\n'
              '            }));\n'
              '        }\n'
              '    }\n\n'
              '    Ok(serde_json::json!({\n'
              '        "results": results,\n'
              '        "query": query,\n'
              '        "total": results.len(),\n'
              '        "degraded": degraded,\n'
              '        "warnings": warnings\n'
              '    }))\n'
              '}\n\n'
          )
          commands = commands[:search_start] + new_search + commands[search_end:]

          hybrid_start = commands.index('/// Get hybrid search results (FTS5 + vector)')
          new_hybrid = (
              '/// Get hybrid search results (FTS5 + vector) through Core.\n'
              '#[tauri::command]\n'
              'pub async fn hybrid_search(\n'
              '    query: String,\n'
              '    limit: Option<usize>,\n'
              "    state: State<'_, AppState>,\n"
              ') -> Result<serde_json::Value, String> {\n'
              '    let engine = state.engine().ok_or("Engine not initialized")?;\n'
              '    let outcome = engine\n'
              '        .search_knowledge(&query, limit.unwrap_or(20))\n'
              '        .await\n'
              '        .map_err(|e| e.to_string())?;\n\n'
              '    let degraded = outcome.degraded();\n'
              '    let warnings: Vec<String> = outcome\n'
              '        .degradations\n'
              '        .iter()\n'
              '        .map(|d| d.message.clone())\n'
              '        .collect();\n'
              '    let items: Vec<serde_json::Value> = outcome\n'
              '        .hits\n'
              '        .into_iter()\n'
              '        .map(|hit| serde_json::json!({\n'
              '            "knowledge_id": hit.knowledge_id,\n'
              '            "chunk_id": hit.chunk_id,\n'
              '            "chunk_text": hit.chunk_text,\n'
              '            "score": hit.score,\n'
              '            "match_type": hit.match_type\n'
              '        }))\n'
              '        .collect();\n\n'
              '    Ok(serde_json::json!({\n'
              '        "results": items,\n'
              '        "query": query,\n'
              '        "total": items.len(),\n'
              '        "degraded": degraded,\n'
              '        "warnings": warnings\n'
              '    }))\n'
              '}\n'
          )
          commands_path.write_text(commands[:hybrid_start] + new_hybrid)
          PY
      - name: Commit clean product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/aiks-core/src/pipeline/search.rs \
            crates/aiks-core/src/pipeline/knowledge_repo.rs \
            crates/aiks-core/src/engine/mod.rs \
            crates/aiks-core/tests/p1_search_semantics.rs \
            apps/aiks-desktop/src-tauri/src/commands.rs \
            apps/aiks-desktop/src/api/types.ts
          git commit -m "fix(p1): harden search semantics and bound vector reranking"
          git push origin HEAD:fix/p1-search-clean-build
