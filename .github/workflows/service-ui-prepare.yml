name: Prepare reviewed personal UI wiring
on:
  push:
    branches: [feature/aiks-service-extraction]
    paths: ['scripts/service-ui-native.patch', '.github/workflows/service-ui-prepare.yml']
permissions:
  contents: read
jobs:
  prepare-ui:
    if: github.repository == 'Sunan869/aiks' && github.ref == 'refs/heads/feature/aiks-service-extraction'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Apply exact native patch
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          text=pathlib.Path('scripts/service-ui-native.patch').read_text()
          paths=re.findall(r'diff --git a/(.*?) b/.*?\nindex ([0-9a-f]{40})\.\.',text)
          assert len(paths)==7,paths
          for path,expected in paths:
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==expected,(path,actual,expected)
          subprocess.run(['git','apply','--check','scripts/service-ui-native.patch'],check=True)
          subprocess.run(['git','apply','scripts/service-ui-native.patch'],check=True)
          PY
      - name: Candidate native behavior (not canonical acceptance)
        run: |
          cargo test --locked -p aiks-service --test desktop_preferences -- --test-threads=1 > /tmp/ui-candidate.log 2>&1 && echo 0 > /tmp/ui-exit || echo $? > /tmp/ui-exit
          cargo fmt --all
          git diff --check
      - name: Produce reviewable blobs only
        env:
          BLOB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request,zipfile
          assert os.environ['GITHUB_REPOSITORY']=='Sunan869/aiks'
          assert os.environ['GITHUB_REF']=='refs/heads/feature/aiks-service-extraction'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['GITHUB_SHA']
          changed=subprocess.check_output(['git','diff','--name-only','-z']).split(b'\0')
          manifest={'source_head':head,'test_exit':int(pathlib.Path('/tmp/ui-exit').read_text()),'files':[]}
          with zipfile.ZipFile('/tmp/ui-review.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for raw in changed:
                  if not raw: continue
                  path=raw.decode()
                  assert path.endswith('.rs') and path.startswith('apps/'),path
                  content=pathlib.Path(path).read_bytes()
                  assert len(content)<=512*1024
                  request=urllib.request.Request('https://api.github.com/repos/Sunan869/aiks/git/blobs',method='POST',data=json.dumps({'content':base64.b64encode(content).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['BLOB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
                  with urllib.request.urlopen(request,timeout=30) as response: blob=json.load(response)
                  manifest['files'].append({'path':path,'sha':blob['sha'],'old_sha':subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()})
                  archive.writestr('files/'+path,content)
              archive.writestr('manifest.json',json.dumps(manifest,indent=2))
              archive.write('/tmp/ui-candidate.log','ui-candidate.log')
              archive.writestr('candidate.patch',subprocess.check_output(['git','diff']))
          print('UI_BLOBS='+json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: personal-ui-review-${{ github.sha }}
          path: /tmp/ui-review.zip
          retention-days: 2
