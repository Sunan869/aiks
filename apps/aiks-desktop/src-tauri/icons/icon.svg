<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">AIKS Sync Core</title>
  <desc id="desc">Two connected sync arcs surrounding a central knowledge node</desc>
  <defs>
